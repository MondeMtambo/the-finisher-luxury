services:
  - type: web
    name: the-finisher-luxury-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && (test -f seed_supabase.py && python seed_supabase.py || true) && gunicorn finisher_api.wsgi:application --workers 2 --threads 4 --worker-class gthread --timeout 120
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,thefinishercrm.tech,www.thefinishercrm.tech,thefinisher.tech,www.thefinisher.tech"
      - key: FRONTEND_URL
        value: "https://www.thefinishercrm.tech"
      - key: DEFAULT_FROM_EMAIL
        value: "The Finisher Luxury Registrations <noreply@mtamboholdings.dev>"
      - key: SALES_EMAIL
        value: "noreply@mtamboholdings.dev"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.resend.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "resend"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
